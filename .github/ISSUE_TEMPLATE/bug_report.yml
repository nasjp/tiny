name: Bug report
description: Something in tiny (tinyd, the CLI, the iPhone app, or the relay) is broken
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - tinyd / tiny CLI (Mac)
        - iPhone app
        - Push notifications (relay)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Cursor
        - Not agent-related / other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "Output of `tiny --version` and `tiny doctor`"
      description: Please redact personal details (Tailscale IPs etc.)
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "e.g. output of `tiny serve` running in the foreground, or `log show --predicate 'process == \"node\"' --last 5m`"
      render: text
